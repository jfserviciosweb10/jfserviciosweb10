backend:
  name: github
  repo: jfserviciosweb10/jfserviciosweb10
  branch: main
  base_url: https://jf-decap-oauth.jfserviciosweb.workers.dev

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "posts"
    label: "Articulos del Blog"
    description: "Al guardar, tarda alrededor de 1 minuto en aparecer publicado en la web. No es instantaneo: antes de ese minuto, el cambio todavia no esta terminado."
    folder: "blog/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titulo", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Descripcion corta", name: "description", widget: "string" }
      - { label: "Imagen de portada", name: "image", widget: "image", required: false, hint: "Si la dejas vacia y completas el campo de abajo, la foto se busca sola en Pexels" }
      - { label: "Palabras clave para la foto (en ingles)", name: "pexels_keywords", widget: "string", required: false, hint: "Ej: web design laptop. Solo se usa si no subiste una imagen arriba." }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "faq"
    label: "Preguntas Frecuentes"
    description: "Aca agregas preguntas NUEVAS: aparecen al final de la lista de la web. Las preguntas que ya estaban publicadas no se ven ni se editan desde aca (para cambiar una de esas, pedile a JF Servicios Web). Al guardar, tarda alrededor de 1 minuto en aparecer publicado en la web. No es instantaneo: antes de ese minuto, el cambio todavia no esta terminado."
    files:
      - file: "_data/faq.yml"
        label: "Preguntas nuevas (se suman al final)"
        name: "faq"
        fields:
          - label: "Preguntas"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.pregunta}}"
            fields:
              - { label: "Pregunta", name: "pregunta", widget: "string" }
              - { label: "Respuesta", name: "respuesta", widget: "text" }
