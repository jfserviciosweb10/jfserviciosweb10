backend:
  name: github
  repo: jfserviciosweb10/jfserviciosweb10
  branch: main
  base_url: https://jf-decap-oauth.jfserviciosweb.workers.dev

media_folder: "img/uploads"
public_folder: "img/uploads"

collections:
  - name: "posts"
    label: "Articulos del Blog"
    folder: "blog/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titulo", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Descripcion corta", name: "description", widget: "string" }
      - { label: "Imagen de portada", name: "image", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
