name: Traducir index.html y blog al inglés (automático)

on:
  push:
    branches: [main, master]
    paths: ['index.html', 'blog/**']
  schedule:
    - cron: '0 9 * * *'      # todos los días 06:00 hora Argentina (agarra lo que publica Sveltia)
  workflow_dispatch:          # botón manual "Run workflow"

permissions:
  contents: write             # imprescindible para que el bot pueda guardar

jobs:
  traducir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencia
        run: npm install cheerio@1.0.0 --no-save
      - name: Traducir home
        run: node build-i18n.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Traducir blog
        run: node build-i18n-blog.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name "i18n-bot"
          git config user.email "i18n-bot@users.noreply.github.com"
          git add index.html blog i18n
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "i18n: traducción automática EN [skip ci]"
            git pull --rebase
            git push
          fi
